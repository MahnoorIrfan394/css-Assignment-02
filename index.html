<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOES PRODUCT CARD</title>
    <!--Font Awesome CDN-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
   <div class="parent">
    <div class="card">
        <!--TOP BAR-->
<div class="top">
<div class="logo"></div>
<i class="fa-brands fa-shoelace"></i>
<span>Airmax</span>
</div>
<div class="icons">

<i class="fa-solid fa-magnifying-glass"></i>
<i class="fa-solid fa-user"></i>
<i class="fa-solid fa-cart-shopping"></i>
</div>
    </div>
    <!--left side-->
<div class="left">
    <div class="orange-circle">
<img  src="https://png.pngtree.com/png-vector/20231230/ourmid/pngtree-dropshipping-men-hole-sole-jogging-shoes-png-image_11389148.png" alt="shoes" class="product">
<div class="dots">
<span></span><span></span><span></span>
<span></span><span></span><span></span>
<span></span><span></span><span></span>
</div>
<div class="arrows">
<span class="arrows">
<i class="fa-solid fa-arrow-left-long"></i>
<i class="fa-solid fa-arrow-right-long"></i>
</span>
</div>
    </div>
<!--right side-->
<div class="right">
<p class="small-title"> Sneakers Shoes</p>
<h1>Winter Collection <br>
Men Black Sneakers
</h1>
<!--price-->
<div class="price-box">
<span class="price">$150</span>
 <span class="old-price">&200</span>
</div>
<!--color-->
<div class="color-section">
<span class="label">Color</span>
<div class="colors">
<span class=" color yellow"></span>
<span class=" color black"></span>
<span class=" color blue"></span>
</div>
</div>
<!--quantity-->
<div class="quantity-section">
<span class="label">quantity</span>
<div class="quantity">
<button type="button">
    <i class="fa-solid fa-minus"></i>
</button>
<span>1</span>
<button type="button">
<i class="fa-solid fa-plus"></i>
</button>
</div>
</div>
<!--buttons-->
<div class="buttons">
<button type="button" class="buy">
<i class="fa-solid fa-bag-shopping"></i>Buy Now
</button>
<button type="button" class="cart">
    <i class="fa-solid fa-cart-shopping"></i>Add To cart
</button>
</div>
   </div> 
</body>
</html>
